spring.application.name=bankflow

# ---- MySQL connection ----
# Update username/password to match your local MySQL setup.
# Create the database first: CREATE DATABASE bankflow_db;
spring.datasource.url=jdbc:mysql://localhost:3306/bankflow_db?createDatabaseIfNotExist=true
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ---- JPA / Hibernate ----
# update = create/alter tables automatically, but never deletes existing data
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
jwt.secret=${JWT_SECRET}
server.port=8080
